<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/img/icono_zoo.png">
    <title>Mundo Animal - Formulario</title>
</head>

<body>
    <header>
        <h2 style="text-align: center; color: forestgreen; font-size: 50px;">Mundo Animal</h2>
        <p style="text-align: center; font-size: 20px;">Bienvenidos al paraíso animal</p>
    </header>
    <hr>
    <nav>
        <a href="/index.html">Home</a>
        <a href="https://www.buinzoo.cl/" target="_blank">Página Oficial</a>
        <a href="/pages/galeria.html" target="_blank">Galería</a>
        <a href="/pages/formulario.html" target="_blank">Formulario</a>
        <a href="">Contacto</a>
    </nav>
    <hr>
    <!--Formulario-->
    <main>
        <h2 style="text-align: center;">Formulario de Visita</h2>

        <form action="#" method="get">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="usuario_nombre" placeholder="Escribe tu nombre">
            <br><br>

            <label for="correo">Email:</label>
            <input type="email" id="correo" name="usuario_email" placeholder="Escribe tu correo">
            <br><br>

            <label for="fecha">Fecha de visita:</label>
            <input type="date" id="fecha" name="usuario_fecha">
            <br><br>

            <label for="zona">Zona favorita:</label>
            <select id="zona" name="usuario_zona">
                <option value="osos">Osos</option>
                <option value="felinos">Felinos</option>
                <option value="aves">Aves</option>
            </select>
            <br><br>

            <input type="checkbox" id="terminos" name="terminos">
            <label for="terminos">Acepto recibir información</label>
            <br><br>

            <input type="submit" value="Enviar datos">
        </form>
    </main>
    <hr>
    <footer>
        <p>Autor: Mateo Reyes</p>
        <br>
        <address>Quito - Ecuador</address>
        <br>

            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3989.7917239919384!2d-78.49368612344925!3d-0.20920513540063873!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91d59a10c39a2adb%3A0xb9114664deb7ac7a!2sParque%20Central%20PUCE!5e0!3m2!1ses!2sec!4v1794431444834!5m2!1ses!2sec"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </footer>

</body>

</html>
